<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mineClaude</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mineClaude">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/office.css">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root{
    --bg:#0e1013; --panel:#16191e; --panel2:#1c2027; --line:#272c34;
    --text:#e7eaef; --dim:#9aa3b0; --faint:#6b7482;
    --wait:#f2b53b; --busy:#41c46a; --idle:#5b9cf0; --unknown:#8b93a1; --ended:#5c636e;
    --radius:14px; --gtc:repeat(auto-fill,minmax(min(340px,100%),1fr));
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f5f7; --panel:#ffffff; --panel2:#f8f9fb; --line:#e3e6eb;
      --text:#171a1f; --dim:#5c6472; --faint:#8b94a3;
      --wait:#c8880c; --busy:#1c9c4b; --idle:#2a6fd4; --unknown:#7b838f; --ended:#98a0ac;
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:none;margin:0 auto;padding:24px 24px 56px}

  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  h1 .sub{color:var(--faint);font-weight:400;margin-left:8px;font-size:13px}
  .hright{margin-left:auto;display:flex;align-items:center;gap:14px}
  .conn{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12px}
  .conn .dot{width:7px;height:7px;border-radius:50%;background:var(--busy)}
  .conn.off .dot{background:#d0524a}

  .counts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .count{
    flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;cursor:pointer;transition:.15s;text-align:left
  }
  .count:hover{border-color:var(--faint)}
  .count.active{border-color:currentColor}
  .count .n{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:currentColor}
  .count .l{font-size:12px;color:var(--dim);margin-top:2px}
  .count.waiting{color:var(--wait)} .count.busy{color:var(--busy)}
  .count.ready{color:var(--idle)} .count.idle{color:var(--ended)} .count.all{color:var(--text)}

  .toolbar{display:flex;gap:16px;align-items:center;margin:0 0 16px;color:var(--dim);font-size:12.5px;flex-wrap:wrap}
  .toolbar label{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
  .toolbar input[type=checkbox]{accent-color:var(--idle)}
  .seg{display:flex;align-items:center;gap:6px;margin-left:auto}
  .opts{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .opts button{
    font:inherit;font-size:12px;color:var(--faint);background:none;border:0;border-right:1px solid var(--line);
    padding:5px 10px;cursor:pointer;transition:.12s;min-width:32px
  }
  .opts button:last-child{border-right:0}
  .opts button:hover{color:var(--text);background:var(--panel2)}
  .opts button.on{color:var(--text);background:var(--panel2);box-shadow:inset 0 -2px 0 var(--idle)}
  .opts.icons button{display:flex;align-items:center;justify-content:center;padding:6px 9px}
  .opts.icons button svg{width:15px;height:15px;display:block}

  .iconbtn{
    display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;
    color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    cursor:pointer;transition:.12s;padding:0
  }
  .iconbtn:hover{color:var(--text);border-color:var(--faint)}
  .iconbtn.ok{color:var(--busy);border-color:var(--busy)}
  .iconbtn.err{color:#d0524a;border-color:#d0524a}
  .iconbtn svg{width:15px;height:15px;display:block}

  /* ofis sahnesi + sahnedeki birine tıklayınca sağda açılan kolon */
  #stage{position:relative}
  /* Panel sabit bir kolon: sahnenin içinde yüzen küçük bir kart, uzun mesajı
     gösteremiyordu. Tam boy olunca son iki mesaj olduğu gibi sığıyor. */
  #pick{
    position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(520px,100%);
    display:flex;flex-direction:column;background:var(--panel);
    border-left:1px solid var(--line);box-shadow:-16px 0 44px rgba(0,0,0,.34)
  }
  #pick.waiting{--c:var(--wait)} #pick.busy{--c:var(--busy)} #pick.ready{--c:var(--idle)}
  #pick.idle{--c:var(--ended)} #pick.unknown{--c:var(--unknown)}
  #pick::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .pk-head{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
  .pk-head .proj{font-size:16px}
  .pk-sub{padding:0 16px 12px;border-bottom:1px solid var(--line)}
  .pk-body{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
  .pk-msg{border-left:2px solid var(--line);padding-left:11px}
  .pk-msg.you{border-left-color:var(--idle)}
  .pk-who{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--faint);margin-bottom:3px}
  .pk-text{font-size:13px;line-height:1.55;color:var(--dim);white-space:pre-wrap;word-break:break-word}
  .pk-msg:last-child .pk-text{color:var(--text)}
  .pk-empty{color:var(--faint);font-size:12.5px}
  .pk-foot{border-top:1px solid var(--line);padding:12px 16px 14px}
  .pk-foot .meta{border-top:0;padding-top:0;margin-bottom:10px}
  .pick-x{
    margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;padding:0;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);cursor:pointer
  }
  .pick-x:hover{color:var(--text);border-color:var(--faint)}
  .pick-x svg{width:11px;height:11px;display:block}
  @media (max-width:720px){ #pick{width:100%} }

  /* Ofis gorunumlerinde sayfa viewport'a sigar: sahne kalan yuksekligi alir ve
     disarida scroll cikmaz. Onceden sahne 1600x860 en-boy oraniyla tam genislikte
     ciziliyordu, ekrandan tasip sayfayi kaydiriyordu. Kart gorunumu eskisi gibi akar. */
  body.office{overflow:hidden}
  body.office .wrap{height:100vh;display:flex;flex-direction:column;padding-bottom:16px}
  body.office .counts{margin-bottom:12px}
  body.office footer{display:none}
  body.office #stage{flex:1;min-height:0;display:flex}
  body.office #office,body.office #office3d,body.office #terms{flex:1;min-height:0}
  body.office #office{display:flex}
  body.office #office svg{width:100%;height:100%}
  body.office #office3d{aspect-ratio:auto}

  /* gomulu terminaller */
  .tm-host{display:flex;flex-direction:column;height:100%;min-height:0;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .tm-strip{display:flex;align-items:stretch;gap:2px;padding:6px 6px 0;flex-wrap:wrap;
    border-bottom:1px solid var(--line);background:var(--panel2)}
  .tm-tab{display:flex;align-items:center;gap:7px;font:inherit;font-size:12px;color:var(--faint);
    background:none;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;
    padding:6px 9px;cursor:pointer;max-width:210px;transition:.12s}
  .tm-tab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tm-tab:hover{color:var(--text)}
  .tm-tab.on{color:var(--text);background:var(--panel);border-color:var(--line)}
  .tm-tab.dead{opacity:.5}
  .tm-x{flex:none;opacity:.5;font-size:14px;line-height:1}
  .tm-x:hover{opacity:1;color:#d0524a}
  .tm-plus{font:inherit;font-size:15px;line-height:1;color:var(--faint);background:none;border:0;
    padding:4px 10px;cursor:pointer;align-self:center}
  .tm-plus:hover{color:var(--text)}
  .tm-panes{position:relative;flex:1;min-height:0}
  .tm-pane{position:absolute;inset:0;padding:8px 10px;display:none}
  .tm-pane.on{display:block}
  .tm-pane .xterm{height:100%}
  .tm-empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;
    align-items:center;justify-content:center;color:var(--faint);font-size:13px}
  .tm-empty button{font:inherit;font-size:13px;color:var(--text);background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer}
  .tm-empty button:hover{border-color:var(--faint)}

  /* ayarlar modali */
  .modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);
    display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    width:min(400px,100%);padding:16px 18px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sheet-head b{font-size:15px}
  .sheet .row{display:flex;flex-direction:column;gap:12px;color:var(--dim);font-size:13px}
  .sheet label{display:flex;gap:8px;align-items:center;cursor:pointer;user-select:none}
  .sheet input[type=checkbox]{accent-color:var(--idle)}
  .sheet .seg{margin-left:0;margin-top:4px}

  .grid{display:grid;grid-template-columns:var(--gtc);gap:12px;align-items:start}
  @media (max-width:720px){
    :root{--gtc:minmax(0,1fr) !important}
    .wrap{padding:18px 14px 40px}
    .seg{margin-left:0}
  }

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px 12px;position:relative;overflow:hidden;transition:.15s
  }
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .card:hover{border-color:var(--faint)}
  .card.waiting{--c:var(--wait);box-shadow:0 0 0 1px color-mix(in srgb,var(--wait) 45%,transparent)}
  .card.busy{--c:var(--busy)} .card.ready{--c:var(--idle)} .card.idle{--c:var(--ended)}
  .card.unknown{--c:var(--unknown)} .card.ended{--c:var(--ended);opacity:.72}
  .card.idle,.card.unknown{opacity:.86}

  .row1{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .proj{font-weight:600;letter-spacing:-.01em;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{
    margin-left:auto;flex:none;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);
    display:flex;align-items:center;gap:5px
  }
  .pill .d{width:6px;height:6px;border-radius:50%;background:var(--c)}
  .card.busy .pill .d{animation:pulse 1.1s ease-in-out infinite}
  .card.waiting .pill .d{animation:blink 1s steps(2,start) infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
  @keyframes blink{50%{opacity:.15}}

  .path{color:var(--faint);font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
  .branch{color:var(--dim)}
  .title{font-size:13px;color:var(--dim);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .title .who{color:var(--faint);font-weight:600;font-size:11px;letter-spacing:.03em}

  .banner{
    font-size:12.5px;border-radius:9px;padding:7px 10px;margin-bottom:9px;
    background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);
    display:flex;gap:7px;align-items:flex-start;line-height:1.4
  }
  .banner b{font-weight:600}
  .banner .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}

  .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--faint);
    border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
  .meta span{white-space:nowrap}
  .meta b{color:var(--dim);font-weight:500}

  .bottom{display:flex;gap:6px;align-items:center;margin-top:9px}
  .msg{display:flex;gap:6px;flex:1;min-width:0;align-items:flex-end}
  /* textarea: tek satir yuksekliginde baslar, yazdikca buyur (JS), 6 satirda durur */
  .msg textarea{
    flex:1;min-width:0;font:inherit;font-size:12.5px;line-height:18px;color:var(--text);
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:4px 10px;height:28px;max-height:130px;outline:none;transition:border-color .12s;
    resize:none;overflow-y:auto
  }
  .msg textarea:focus{border-color:var(--idle)}
  .msg textarea::placeholder{color:var(--faint)}
  .msg.ok textarea{border-color:var(--busy)} .msg.err textarea{border-color:#d0524a}
  .msg.off{opacity:.4}
  .msg.off textarea,.msg.off .iconbtn{cursor:not-allowed;background:transparent;border-style:dashed}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
    margin:28px 0 12px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
  h2 .caret{transition:.2s;display:inline-block}
  h2.closed .caret{transform:rotate(-90deg)}
  .empty{color:var(--faint);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}
  footer{margin-top:30px;color:var(--faint);font-size:11.5px;line-height:1.7}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel2);
    border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="appTitle"></span> <span class="sub" id="host"></span></h1>
    <div class="hright">
      <div class="conn" id="conn"><span class="dot"></span><span id="connText"></span></div>
      <div class="opts" id="langSw"></div>
      <div class="opts icons" id="viewSw"></div>
      <button class="iconbtn" id="setBtn"></button>
      <button class="iconbtn" id="fs">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M2 6V2.5h3.5M14 6V2.5h-3.5M2 10v3.5h3.5M14 10v3.5h-3.5"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="counts" id="counts"></div>


  <div id="settings" class="modal" hidden>
    <div class="sheet">
      <div class="sheet-head"><b id="settingsTitle"></b><button class="pick-x" id="setClose"></button></div>
      <div class="row">
        <label><input type="checkbox" id="notify"> <span id="notifyLabel"></span></label>
        <label><input type="checkbox" id="hideEmpty" checked> <span id="hideEmptyLabel"></span></label>
        <label><input type="checkbox" id="sound"> <span id="soundLabel"></span></label>
        <div class="seg" id="colsWrap">
          <span id="colsLabel"></span>
          <div class="opts" id="cols"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="stage" hidden>
    <div id="office" hidden></div>
    <div id="office3d" hidden></div>
    <div id="terms" hidden></div>
    <div id="pick" hidden></div>
  </div>
  <div id="live" class="grid"></div>

  <h2 id="endedHead" class="closed"><span class="caret">▾</span> <span id="endedLabel"></span> <span id="endedCount"></span></h2>
  <div id="ended" class="grid" hidden></div>

  <footer><span id="footer1"></span><br><span id="footer2"></span></footer>
</div>

<script src="/office.js"></script>
<script type="module" src="/office3d.js"></script>
<script type="module" src="/term.js"></script>
<script>
// --- diller ---
// SADECE arayüz metinleri çevrilir. Claude'un mesajları, proje adları, tool adları,
// yollar ve Claude Code'un kendi ürettiği metinler (waitingFor) olduğu gibi kalır.
const I18N = {
  tr: {
    appTitle:"Claude session'ları", live:'canlı', connecting:'bağlanıyor…',
    disconnected:'bağlantı koptu — yeniden deneniyor',
    serverDown:'mineClaude sunucusu çalışmıyor', serverDownHint:'Terminalde başlat:',
    officeView:'Ofis görünümü', office3dView:'3D ofis görünümü', cardView:'Kart görünümü',
    fullscreen:'Tam ekran', camHint:'tıkla: kart · sürükle: döndür · space+sürükle: kaydır · tekerlek: yakınlaş · çift tık: sıfırla',
    all:'tümü', waiting:'input bekliyor', busy:'çalışıyor', ready:'beklemede', idle:'boşta',
    unknown:'bilinmiyor', ended:'kapandı',
    notifyLabel:'input bekleyince bildirim gönder', soundLabel:'durum değişince ses çal', hideEmptyLabel:'boş/kullanılmayan süreçleri gizle',
    columns:'kolon', waitsForYou:'Senden input bekliyor',
    'no-conversation':'Bu süreçte hiç konuşma yok', 'maybe-permission':'izin bekliyor olabilir',
    context:'bağlam', messages:'mesaj', openFor:'açık', permission:'izin',
    send:'gönder', msgPlaceholder:'mesaj gönder', msgClosed:'mesajlaşmaya kapalı',
    msgClosedWhy:'Bu session mesajlaşmaya kapalı: açılışta soket almamış. Devam ettirirken --messaging-socket-path verirsen açılır.',
    copyResume:'resume komutunu kopyala', copyCd:'klasöre gitme komutunu kopyala',
    copyTranscript:'transcript yolunu kopyala',
    focusTty:(t)=>`terminal sekmesine git (${t})`,
    focusTtyNone:'sekme bulunamadı — terminal kapanmış olabilir',
    close:'kapat', loading:'yükleniyor…', noMessages:'mesaj bulunamadı', you:'Sen',
    settings:'Ayarlar',
    petCat:'kediyi sev', asked:'soru sordu',
    termView:'Terminaller', termNew:'klasör seç ve terminal aç', termEmpty:'Açık terminal yok.',
    termClosed:'kapandı', termHere:'burada terminal aç',
    askedWhy:'Claude turu bitirirken bir soru sordu. Bu bizim çıkarımımız: Claude Code bunu "input bekliyor" diye yazmıyor, mesajın sonundaki soru işaretinden anlıyoruz.',
    noneInFilter:'Bu filtrede session yok.', recentlyClosed:'son kapanan session\'lar',
    notifTitle:(p)=>`${p} senden input bekliyor`,
    notifAsked:(p)=>`${p} sana bir soru sordu`,
    justNow:'az önce', sec:'sn önce', min:'dk önce', hour:'sa önce', day:'gün önce',
    dMin:'dk', dHour:'sa', dDay:'g',
    desks:'MASALAR', lounge:'LOUNGE',
    footer1:(a,b,c)=>`Kaynak: ${a} + ${b} + ${c}. 2 saniyede bir yenilenir.`,
    footer2:(a,b)=>`Terminalden: ${a} · JSON: ${b}`,
  },
  en: {
    appTitle:'Claude sessions', live:'live', connecting:'connecting…',
    disconnected:'connection lost — retrying',
    serverDown:'The mineClaude server is not running', serverDownHint:'Start it in your terminal:',
    officeView:'Office view', office3dView:'3D office view', cardView:'Card view',
    fullscreen:'Fullscreen', camHint:'click: card · drag: rotate · space+drag: pan · wheel: zoom · double-click: reset',
    all:'all', waiting:'waiting for input', busy:'working', ready:'standing by', idle:'idle',
    unknown:'unknown', ended:'ended',
    notifyLabel:'notify me when a session wants input', soundLabel:'play a sound on status changes', hideEmptyLabel:'hide unused processes',
    columns:'columns', waitsForYou:'Waiting for your input',
    'no-conversation':'No conversation in this process', 'maybe-permission':'may be waiting for permission',
    context:'context', messages:'messages', openFor:'open', permission:'perm',
    send:'send', msgPlaceholder:'send a message', msgClosed:'messaging unavailable',
    msgClosedWhy:'This session has no messaging socket: it did not get one at startup. Resume it with --messaging-socket-path to enable it.',
    copyResume:'copy resume command', copyCd:'copy cd command',
    copyTranscript:'copy transcript path',
    focusTty:(t)=>`go to the terminal tab (${t})`,
    focusTtyNone:'tab not found — the terminal may have been closed',
    close:'close', loading:'loading…', noMessages:'no messages found', you:'You',
    settings:'Settings',
    petCat:'pet the cat', asked:'asked you something',
    termView:'Terminals', termNew:'pick a folder and open a terminal', termEmpty:'No terminals open.',
    termClosed:'closed', termHere:'open a terminal here',
    askedWhy:'Claude ended its turn with a question. This one is inferred: Claude Code does not record it as waiting for input, we read it off the question mark at the end of the message.',
    noneInFilter:'No sessions in this filter.', recentlyClosed:'recently closed sessions',
    notifTitle:(p)=>`${p} is waiting for your input`,
    notifAsked:(p)=>`${p} asked you something`,
    justNow:'just now', sec:'s ago', min:'m ago', hour:'h ago', day:'d ago',
    dMin:'m', dHour:'h', dDay:'d',
    desks:'DESKS', lounge:'LOUNGE',
    footer1:(a,b,c)=>`Sources: ${a} + ${b} + ${c}. Refreshes every 2 seconds.`,
    footer2:(a,b)=>`In the terminal: ${a} · JSON: ${b}`,
  },

// Varsayılan: tarayıcının dil listesinde Türkçe geçiyorsa TR, yoksa EN.

// --- ses: dosya yok, iki nota WebAudio ile sentezleniyor ---
const soundBox = $('#sound');
soundBox.checked = localStorage.getItem('cc.sound') === '1';
let actx = null;
soundBox.onchange = () => {
  localStorage.setItem('cc.sound', soundBox.checked ? '1' : '0');
  // AudioContext yalnızca kullanıcı hareketiyle açılabiliyor; kutuya tıklamak o hareket
  if(soundBox.checked) ping('waiting');
};
function ping(kind){
  if(!soundBox.checked) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime;
    const g = actx.createGain();
    g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    // input bekliyor: yükselen ikili · turunu bitirdi: alçalan ikili
    const notes = kind === 'waiting' ? [784, 1175] : [784, 523];
    notes.forEach((f, i) => {
      const o = actx.createOscillator();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, t0 + i * 0.1);
      o.connect(g);
      o.start(t0 + i * 0.1);
      o.stop(t0 + i * 0.1 + 0.45);
    });
  }catch{}
}

function fillMessages(pop, msgs){
  const body = pop.querySelector('.pk-body');
  if(!msgs || !msgs.length){ body.innerHTML = `<div class="pk-empty">${T('noMessages')}</div>`; return; }
  body.innerHTML = msgs.map(m =>

function updatePick(pop, s, now){
  const st = disp(s);
  pop.className = st;
  pop.querySelector('.proj').textContent = s.project || '?';
  pop.querySelector('.proj').title = s.name || s.project || '';
  const pill = pop.querySelector('.pill');
  pill.querySelector('.t').textContent = asked(s) ? T('asked') : T(st);
  pill.title = asked(s) ? T('askedWhy') : '';
  const path = pop.querySelector('.path');
  path.textContent = s.cwdShort || s.cwd || '';
  path.title = s.cwd || '';
  pop.querySelector('.meta').innerHTML = metaBits(s, now);

  // Mesajları /api/state ile taşımıyoruz (her session için kilobaytlarca metin
  // olurdu); panel açıkken ve konuşma ilerlediğinde ayrıca istiyoruz.
  const key = String(s.sessionId) + ':' + (s.lastActivityAt || 0);
  if(s.sessionId && key !== pickMsgKey){
    pickMsgKey = key;
    // Yanıt geldiğinde hâlâ bunu mu bekliyoruz? Hızlı hızlı iki kişiye tıklayınca
    // ilk isteğin yanıtı ikincinin paneline düşebiliyordu; `picked === pickFor`
    // bunu yakalamıyor çünkü ikisi birlikte güncelleniyor. Ölçüt istek anahtarı.
    fetch('/api/messages?session=' + encodeURIComponent(s.sessionId))
      .then(r => r.json())
      .then(d => {
        if(pickMsgKey !== key) return;                 // bu arada başka bir istek başlamış
        if(d && d.sessionId === s.sessionId) fillMessages(pop, d.messages);
        else fillMessages(pop, null);                  // transcript yok: "yükleniyor"da asılı kalmasın
      })
      .catch(() => { if(pickMsgKey === key) fillMessages(pop, null); });
  }
}

function renderPicked(now){
  const pop = $('#pick');
  const s = picked && state && state.live.find(x => String(x.sessionId || x.pid) === picked);
  if(!s){ picked = null; pickFor = null; pickMsgKey = null; pop.hidden = true; pop.innerHTML = ''; return; }
  if(pickFor !== picked){ buildPick(pop, s); pickFor = picked; pickMsgKey = null; }
  pop.hidden = false;
  updatePick(pop, s, now);
}

function rel(ms, now){
  if(!ms) return '—';
  const s = Math.max(0, Math.round((now - ms)/1000));
  if(s < 10) return T('justNow');
  if(s < 60) return s + ' ' + T('sec');
  if(s < 3600) return Math.round(s/60) + ' ' + T('min');
  if(s < 86400) return Math.round(s/3600) + ' ' + T('hour');
  return Math.round(s/86400) + ' ' + T('day');
}
function dur(ms){
  if(!ms) return '—';
  const s = Math.round(ms/1000);
  if(s < 3600) return Math.round(s/60)+T('dMin');
  if(s < 86400) return Math.round(s/3600)+T('dHour');
  return Math.round(s/86400)+T('dDay');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shortModel(m){
  if(!m || !/^claude-/.test(m)) return null;
  return m.replace(/^claude-/,'').replace(/-\d{8}$/,'');
}

function flash(el, cls){
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls), 1400);
}
function copy(btn, text){
  navigator.clipboard.writeText(text).then(()=>{
    const old = btn.innerHTML;
    btn.innerHTML = svg('check'); btn.classList.add('ok');
    setTimeout(()=>{ btn.innerHTML = old; btn.classList.remove('ok'); }, 1300);
  }, ()=> flash(btn,'err'));
}

// kart ve yan panel ayni parcalari kullaniyor
function metaBits(s, now){
  const bits = [];
  if(s.pid) bits.push(`<span><b>pid</b> ${s.pid}</span>`);
  if(s.host) bits.push(`<span>${esc(s.host)}</span>`);
  if(shortModel(s.model)) bits.push(`<span>${esc(shortModel(s.model))}</span>`);
  if(s.contextTokens) bits.push(`<span><b>${Math.round(s.contextTokens/1000)}k</b> ${T('context')}</span>`);
  if(s.userTurns) bits.push(`<span>${s.userTurns}+ ${T('messages')}</span>`);
  if(s.startedAt) bits.push(`<span>${dur(now - s.startedAt)} ${T('openFor')}</span>`);
  if(s.permissionMode && s.permissionMode !== 'default') bits.push(`<span>${T('permission')}: ${esc(s.permissionMode)}</span>`);
  if(s.sizeMb) bits.push(`<span>${s.sizeMb} MB</span>`);
  return `<span><b>${rel(s.lastActivityAt || s.startedAt, now)}</b></span>${bits.join('')}`;
}

function actionBtns(s){
  const acts = [];
  // Terminal sekmesine gitmek AppleScript istiyor: yalniz masaustu uygulamasinda var
  if(window.mineClaudeDesktop && s.kind === 'live' && s.tty)
    acts.push(`<button class="iconbtn" title="${T('focusTty', esc(s.tty))}" data-tty="${esc(s.tty)}" data-host="${esc(s.host || '')}">${svg('terminal')}</button>`);
  // uygulamanin icinde, bu klasorde yeni bir terminal
  if(hasTerm() && s.cwd)
    acts.push(`<button class="iconbtn" title="${T('termHere')}: ${esc(s.cwd)}" data-term-cwd="${esc(s.cwd)}">${svg('term')}</button>`);
  if(s.sessionId) acts.push(`<button class="iconbtn" title="${T('copyResume')}: claude --resume ${s.sessionId}" data-copy="claude --resume ${s.sessionId}">${svg('resume')}</button>`);
  if(s.cwd) acts.push(`<button class="iconbtn" title="${T('copyCd')}: ${esc(s.cwd)}" data-copy="cd &quot;${esc(s.cwd)}&quot;">${svg('folder')}</button>`);
  if(s.transcript) acts.push(`<button class="iconbtn" title="${T('copyTranscript')}: ${esc(s.transcript)}" data-copy="${esc(s.transcript)}">${svg('file')}</button>`);

function wireActions(root){
  root.querySelectorAll('button[data-term-cwd]').forEach(b => b.onclick = () => {
    view = 'term'; localStorage.setItem('cc.view', view); applyViewBtn(); render();
    MTerm.open(b.dataset.termCwd);
  });
  root.querySelectorAll('button[data-copy]').forEach(b => b.onclick = () => copy(b, b.dataset.copy));
  root.querySelectorAll('button[data-tty]').forEach(b => b.onclick = async () => {
    const r = await window.mineClaudeDesktop.focusTerminal({ tty: b.dataset.tty, host: b.dataset.host });
    if(!r || !r.ok){ flash(b, 'err'); b.title = T('focusTtyNone'); }
  });

function wireMsgForm(root, pid){
  const form = root.querySelector('.msg:not(.off)');
  if(!form) return;
  const input = form.querySelector('textarea');
  // tek satirdan basla, icerik buyudukce uzat (CSS max-height'te durur)
  const grow = () => {
    input.style.height = 'auto';
    // alt sinir 28px: tek satirken yanindaki gonder dugmesiyle ayni yukseklikte dursun
    input.style.height = Math.max(28, Math.min(input.scrollHeight, 130)) + 'px';
  };
  input.oninput = () => { drafts.set(pid, input.value); grow(); };
  if(input.value) grow();
  // textarea'da Enter varsayilan olarak yeni satir yazar; gondermeyi ona baglayip
  // yeni satiri Shift+Enter'a aliyoruz — sohbet kutularinin alisilmis davranisi.
  input.onkeydown = (e) => {
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      form.requestSubmit ? form.requestSubmit() : form.onsubmit(new Event('submit'));
    }
  };
  form.onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    input.disabled = true;
    fetch('/api/send', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({pid, text}),
    })
    .then(r => r.json())
    .then(r => {
      input.disabled = false;
      if(r.ok){ input.value=''; drafts.delete(pid); grow(); flash(form,'ok'); input.focus(); }
      else { flash(form,'err'); input.title = r.error || 'gönderilemedi'; }
    })
    .catch(() => { input.disabled = false; flash(form,'err'); });
  };
}

function card(s, now){

    banner = `<div class="banner"><b>${esc(s.lastTool.name)}</b><div class="txt">${esc(s.lastTool.detail || '')}</div></div>`;
  } else if(s.empty){
    banner = `<div class="banner"><b>·</b><div>${T('no-conversation')}</div></div>`;
  }

  const acts = actionBtns(s);
  const msgBox = msgBoxHtml(s);

  el.innerHTML = `
    <div class="row1">
      <div class="proj" title="${esc(s.name || s.project)}">${esc(s.project || '?')}</div>
      <div class="pill"${asked(s) ? ` title="${esc(T('askedWhy'))}"` : ''}><span class="d"></span>${asked(s) ? T('asked') : T(st)}</div>
    </div>
    <div class="path" title="${esc(s.cwd||'')}">${esc(s.cwdShort || s.cwd || '')}${s.gitBranch ? ` <span class="branch">@${esc(s.gitBranch)}</span>` : ''}</div>
    ${s.lastText || s.lastPrompt || s.title
      ? `<div class="title" title="${esc([s.title, s.lastPrompt && 'Sen: ' + s.lastPrompt].filter(Boolean).join('\n'))}">
           ${s.lastText ? `<b class="who">Claude</b> ` : ''}${esc(s.lastText || s.lastPrompt || s.title)}
         </div>` : ''}
    ${banner}
    <div class="meta">${metaBits(s, now)}</div>
    ${acts.length || msgBox ? `<div class="bottom">${acts.join('')}${msgBox}</div>` : ''}`;

  wireActions(el);
  wireMsgForm(el, s.pid);
  return el;
}

// render sirasinda odakta olan mesaj kutusunu koru
function snapshotFocus(){
  const a = document.activeElement;
  if(a && a.tagName === 'TEXTAREA' && a.closest('.msg') && !a.closest('#pick'))
    return { pid: a.closest('.msg').dataset.pid, start: a.selectionStart, end: a.selectionEnd };
  return null;
}
function restoreFocus(f){
  if(!f) return;
  const input = document.querySelector(`.grid .msg[data-pid="${f.pid}"] textarea`);
  if(!input) return;
  input.focus();
  try { input.setSelectionRange(f.start, f.end); } catch {}
}

function render(){
  if(!state) return;
  const focus = snapshotFocus();
  const now = Date.now();
  const base = hideEmptyBox.checked ? state.live.filter(s => !s.empty) : state.live;
  const n = (f) => base.filter(f).length;

  const defs = [
    ['all', T('all'), base.length],
    ['waiting', T('waiting'), n(s => disp(s) === 'waiting')],
    ['busy', T('busy'), n(s => disp(s) === 'busy')],
    ['ready', T('ready'), n(s => disp(s) === 'ready')],
    ['idle', T('idle'), n(s => disp(s) === 'idle' || disp(s) === 'unknown')],
  ];
  $('#counts').innerHTML = defs.map(([k,l,c]) =>
    `<button class="count ${k} ${filter===k?'active':''}" data-f="${k}"><div class="n">${c}</div><div class="l">${l}</div></button>`
  ).join('');
  $('#counts').querySelectorAll('.count').forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });

  let list = base.slice();
  if(filter === 'waiting') list = list.filter(s => disp(s) === 'waiting');
  if(filter === 'busy') list = list.filter(s => disp(s) === 'busy');
  if(filter === 'ready') list = list.filter(s => disp(s) === 'ready');
  if(filter === 'idle') list = list.filter(s => disp(s) === 'idle' || disp(s) === 'unknown');

  // 3D seçiliyken modül henüz gelmediyse 2D ofise düş
  let v = (view === 'office3d' && !has3d()) ? 'office' : view;
  if (v === 'term' && !hasTerm()) v = 'cards';
  const office = v !== 'cards';
  document.body.classList.toggle('office', office);
  $('#stage').hidden = !office;
  $('#office').hidden = v !== 'office';
  $('#office3d').hidden = v !== 'office3d';
  $('#terms').hidden = v !== 'term';
  $('#live').hidden = office;
  $('#endedHead').hidden = office;
  $('#colsWrap').hidden = office;

  if(office){
    if(v === 'term') MTerm.mount($('#terms'), T);
    else if(v === 'office3d') Office3D.render(list, $('#office3d'), T, lang);
    else Office.render(list, $('#office'), T, lang);
    if(v !== 'term') renderPicked(now); else { picked = null; $('#pick').hidden = true; }
    $('#ended').hidden = true;
  } else {
    picked = null; pickFor = null; pickMsgKey = null;
    $('#pick').hidden = true; $('#pick').innerHTML = '';
    const live = $('#live');
    live.innerHTML = '';
    if(!list.length) live.innerHTML = `<div class="empty" style="grid-column:1/-1">${T('noneInFilter')}</div>`;
    else for(const s of list) live.appendChild(card(s, now));

    $('#endedCount').textContent = state.ended.length ? `(${state.ended.length})` : '';
    const endedEl = $('#ended');
    endedEl.innerHTML = '';
    for(const s of state.ended) endedEl.appendChild(card(s, now));
    $('#ended').hidden = !endedOpen;
  }

  const w = n(s => disp(s) === 'waiting');
  document.title = (w ? `(${w}) ` : '') + `mineClaude — ${base.length} session`;
  // kurulu PWA'da dock ikonunun uzerindeki sayi
  if(navigator.setAppBadge){
    if(w) navigator.setAppBadge(w).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }
  // Electron uygulamasinda menu bar ikonunun rengi ve yanindaki sayi
  if(window.mineClaudeDesktop) window.mineClaudeDesktop.setStatus({ waiting: w, total: base.length });
  $('#host').textContent = state.host ? '· ' + state.host : '';
  restoreFocus(focus);
}

let prevDisp = new Map();
function checkNotify(){
  const nowWaiting = new Set(state.live.filter(s => disp(s) === 'waiting').map(s => s.sessionId || s.pid));

  // ses: yeni input beklemeye geçen ve turunu yeni bitiren session'lar
  const nextDisp = new Map();
  for(const s of state.live){
    const key = String(s.sessionId || s.pid), d = disp(s), was = prevDisp.get(key);
    nextDisp.set(key, d);
    if(was === undefined) continue;
    if(d === 'waiting' && was !== 'waiting') ping('waiting');
    else if(d === 'ready' && was === 'busy') ping('done');
  }
  prevDisp = nextDisp;
  if(notifyBox.checked && Notification.permission === 'granted'){
    for(const s of state.live){
      const key = s.sessionId || s.pid;
      if(disp(s) === 'waiting' && !prevWaiting.has(key)){
        // soru sorduysa waitingFor yok; bildirimin govdesi Claude'un sorusu olsun
        const body = s.waitingFor || (asked(s) ? s.lastText : '') || '';
        const note = new Notification(asked(s) ? T('notifAsked', s.project) : T('notifTitle', s.project), {
          body: body + (s.title ? '\n' + s.title : ''), tag: String(key),
        });
        note.onclick = () => { if(window.mineClaudeDesktop) window.mineClaudeDesktop.show(); else window.focus(); };
      }
    }
  }
  prevWaiting = nowWaiting;
}

// Kediyi sevince: mirlama. Ses dosyasi yok — gercek bir mirilti ~25 Hz'lik bir
// genlik titresimidir, o yuzden alcak geciren filtreden gecmis kahverengi gurultuyu
// 25 Hz'lik bir LFO ile titretiyoruz. Basina kisa bir "mrrp" cikisi kediyi
// vizildayan bir cihazdan ayiriyor.
function purr(){
  if(!soundBox.checked) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime, DUR = 1.9;

    // kahverengi gurultu: beyaz gurultunun entegrali, alcak frekanslara agirlik verir
    const len = Math.ceil(actx.sampleRate * DUR);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for(let i = 0; i < len; i++){
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.5;
    }
    const src = actx.createBufferSource();
    src.buffer = buf;

    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 1.2;

    // Titresim: LFO -> am.gain. Taban 0.62, salinim ±0.38 => 0.24..1 arasi.
    // Tam 0'a inen bir modulasyon (taban 0.5) olculdugunde derinlik 1.00 cikiyor ve
    // mirlamadan cok kesikli bir brrr gibi duyuluyor; kedi darbeler arasinda susmuyor.
    const am = actx.createGain();
    am.gain.value = 0.62;
    const lfo = actx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(24, t0);
    lfo.frequency.linearRampToValueAtTime(27, t0 + DUR);   // sonuna dogru hafif hizlanir
    const lfoGain = actx.createGain();
    lfoGain.gain.value = 0.38;
    lfo.connect(lfoGain).connect(am.gain);

    const out = actx.createGain();
    out.gain.setValueAtTime(0.0001, t0);
    out.gain.exponentialRampToValueAtTime(0.15, t0 + 0.18);
    out.gain.setValueAtTime(0.15, t0 + DUR - 0.5);
    out.gain.exponentialRampToValueAtTime(0.0001, t0 + DUR);

    src.connect(lp).connect(am).connect(out).connect(actx.destination);
    lfo.start(t0); lfo.stop(t0 + DUR);
    src.start(t0); src.stop(t0 + DUR);

    // kisa "mrrp": inen bir uculuk, mirlamanin uzerine biniyor
    const o = actx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(700, t0);
    o.frequency.exponentialRampToValueAtTime(410, t0 + 0.16);
    const og = actx.createGain();
    og.gain.setValueAtTime(0.0001, t0);
    og.gain.exponentialRampToValueAtTime(0.05, t0 + 0.04);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    o.connect(og).connect(actx.destination);
    o.start(t0); o.stop(t0 + 0.24);
  }catch{}
}

function setConn(ok, text){
  $('#conn').classList.toggle('off', !ok);
  $('#connText').textContent = text;
  if(!ok && window.mineClaudeDesktop) window.mineClaudeDesktop.setStatus({ down:true });
}

// Dock ikonundan acilip sunucunun kapali oldugu durum artik sik: ne yapmasi
// gerektigini soylemezsek kullanici bos bir pencereye bakiyor.
function showDown(){
  $('#stage').hidden = true;
  $('#live').hidden = false;
  $('#live').innerHTML =
    `<div class="empty" style="grid-column:1/-1">
       <div style="font-weight:600;color:var(--text);margin-bottom:6px">${T('serverDown')}</div>
       <div style="margin-bottom:10px">${T('serverDownHint')}</div>
       <code>npx mineclaude</code>
     </div>`;
}

function connect(){
  es = new EventSource('/events');
  es.onopen = () => setConn(true, T('live'));
  es.onmessage = (e) => { state = JSON.parse(e.data); checkNotify(); render(); setConn(true, T('live')); };
  es.onerror = () => {
    setConn(false, T('disconnected'));
    if(!state) showDown();
    es.close();
    setTimeout(connect, 2500);
  };
}
connect();

// PWA: kendi penceresinde kurulabilsin, sunucu kapaliyken duzgun bir sayfa gosterebilsin.
// Electron uygulamasinda gereksiz: orada cache yerine her acilista taze sayfa istiyoruz.
if('serviceWorker' in navigator && location.protocol !== 'file:' && !window.mineClaudeDesktop){
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
// goreli zamanlari tazele; mesaj yazilirken kozmetik render'i atla
setInterval(() => {
  if(!state) return;
  const a = document.activeElement;
  if(a && a.tagName === 'TEXTAREA' && a.closest('.msg')) return;
  render();
}, 1000);
</script>
