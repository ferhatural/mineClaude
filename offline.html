<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mineClaude</title>
<style>
  :root{ --bg:#0e1013; --panel:#16191e; --line:#272c34; --text:#e7eaef; --dim:#9aa3b0; --faint:#6b7482 }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f5f7; --panel:#fff; --line:#e3e6eb; --text:#171a1f; --dim:#5c6472; --faint:#8b94a3 }
  }
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,sans-serif
  }
  .box{max-width:420px;padding:28px 30px;background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:center}
  img{width:64px;height:64px;border-radius:14px;margin-bottom:14px}
  h1{font-size:17px;margin:0 0 6px}
  p{color:var(--dim);margin:0 0 16px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--text)}
  small{display:block;color:var(--faint);margin-top:14px;font-size:11.5px}
</style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="">
    <h1 data-i18n="t">mineClaude sunucusuna ulaşılamıyor</h1>
    <p data-i18n="d">Panel yerel sunucudan besleniyor. Terminalde başlat:</p>
    <code>npx mineclaude</code>
    <small id="retry">Bağlantı bekleniyor…</small>
  </div>
<script>
  var tr = (navigator.languages || [navigator.language || '']).some(function(l){
    return String(l).toLowerCase().indexOf('tr') === 0;
  });
  if(!tr){
    document.documentElement.lang = 'en';
    document.querySelector('[data-i18n=t]').textContent = 'Cannot reach the mineClaude server';
    document.querySelector('[data-i18n=d]').textContent = 'The dashboard is served by the local server. Start it in your terminal:';
    document.getElementById('retry').textContent = 'Waiting for the connection…';
  }
  // sunucu geri gelince kendiliginden panele don
  setInterval(function(){
    fetch('/api/state', { cache: 'no-store' }).then(function(r){ if(r.ok) location.replace('/'); }).catch(function(){});
  }, 3000);
</script>
</body>
</html>
