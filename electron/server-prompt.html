<!doctype html>
<meta charset="utf-8">
<title>mineClaude</title>
<style>
  :root{
    --bg:#0e1013; --fg:#e7e3da; --dim:#8b8578; --line:#2a2d33;
    --inbg:#15181d; --acc:#2a6fd4; --accfg:#fff; --btn:#20242b;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#fbf7ee; --fg:#33302a; --dim:#776f65; --line:#ddd6c8;
           --inbg:#fff; --btn:#ece5d7; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:18px 20px; background:var(--bg); color:var(--fg);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; gap:10px; height:100vh;
  }
  h1{font-size:14px; font-weight:600; margin:0}
  p{margin:0; color:var(--dim); font-size:12px}
  input{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px;
    background:var(--inbg); color:var(--fg); font-size:13px; font-family:inherit;
  }
  input:focus{outline:none; border-color:var(--acc)}
  #err{color:#d9534f; font-size:12px; min-height:15px; margin:0}
  .row{display:flex; gap:8px; justify-content:flex-end; margin-top:auto}
  button{
    padding:7px 16px; border-radius:7px; border:1px solid var(--line);
    background:var(--btn); color:var(--fg); font:inherit; cursor:pointer;
  }
  button.pri{background:var(--acc); border-color:var(--acc); color:var(--accfg)}
  button:disabled{opacity:.5; cursor:default}
</style>
<h1 id="t">Add server</h1>
<p id="h">Address of the machine running mineClaude.</p>
<input id="u" type="text" spellcheck="false" autocomplete="off" placeholder="https://ferhat-macmini.taila07197.ts.net">
<p id="err"></p>
<div class="row">
  <button id="c">Cancel</button>
  <button id="o" class="pri">Connect</button>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const P = window.mineClaudePrompt;

  P.init().then((L) => {
    $('#t').textContent = L.title;
    $('#h').textContent = L.hint;
    $('#c').textContent = L.cancel;
    $('#o').textContent = L.ok;
    $('#u').placeholder = L.placeholder;
    if (L.value) $('#u').value = L.value;
    $('#u').focus();
    $('#u').select();
  });

  // Yazilani URL'ye cevir: sema yoksa https varsay. "macmini:7788" gibi bir sey
  // yazildiginda https'e zorlamak yanlis olurdu — port varsa ve 443 degilse http.
  function topla(ham) {
    let s = String(ham || '').trim();
    if (!s) return null;
    if (!/^https?:\/\//i.test(s)) s = (/:\d+$/.test(s) && !/:443$/.test(s) ? 'http://' : 'https://') + s;
    try {
      const u = new URL(s);
      if (!u.hostname) return null;
      return u.origin;           // yol/sorgu atilsin, kok adres yeter
    } catch { return null; }
  }

  function gonder() {
    const url = topla($('#u').value);
    if (!url) { $('#err').textContent = '—'; $('#u').focus(); return; }
    $('#err').textContent = '';
    $('#o').disabled = true;
    P.submit(url);
  }

  $('#o').onclick = gonder;
  $('#c').onclick = () => P.cancel();
  $('#u').onkeydown = (e) => {
    if (e.key === 'Enter') gonder();
    if (e.key === 'Escape') P.cancel();
  };
  $('#u').oninput = () => { $('#err').textContent = ''; };
</script>
