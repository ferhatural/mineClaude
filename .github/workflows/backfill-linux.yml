name: backfill-linux

# Tek seferlik yardimci: v1.3.2/v1.3.3'te electron-builder AppImage'i
# uretmisti ama draft/release publish tipi uyusmazligi yuzunden yuklemeyi
# atlamisti (bkz. fecab35). --publish never ile uretip elle yukluyoruz.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Hangi tag icin uretilecek (orn. v1.3.2)'
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: AppImage uret
        run: npx electron-builder --linux AppImage --publish never

      - name: Release'e ekle
        run: |
          ls -lh dist/*.AppImage dist/latest-linux.yml
          gh release upload "${{ inputs.tag }}" dist/*.AppImage dist/latest-linux.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
