name: release

# Bir surum etiketi push edilince macOS DMG'lerini uretip Release'e ekler.
#
#   npm version 1.1.0 && git push --follow-tags
#
# Imzalama yok: Apple Developer hesabi gerektiriyor. Imzasiz uygulama indirilince
# Gatekeeper karantinaya aliyor, install.sh onu temizliyor.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Etiket ile package.json surumu ayrisirsa dosya adlari etiketle uyusmuyor
      # ve install.sh indirecegi URL'i bulamiyor. Sessizce gecmesin.
      - name: Etiket ve surum ayni mi
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "etiket v$tag ile package.json surumu $pkg ayni degil" >&2
            exit 1
          fi

      - run: npm ci

      # npm, native paketlerin kurulum betiklerini varsayilan olarak engelliyor.
      # node-pty derlemeye ihtiyac duymuyor (N-API onceden derlenmis ikili getiriyor)
      # ama izinleri ayarlayan post-install adimi da atlaniyor: spawn-helper
      # calistirilabilir olmazsa PTY acilirken "posix_spawnp failed" veriyor.
      - name: node-pty spawn-helper izni
        run: |
          chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper
          ls -l node_modules/node-pty/prebuilds/darwin-*/spawn-helper

      # electron-builder'in kendi yayincisi her dosyayi ayri ayri yukluyor ve her biri
      # release'i yaratmayi deniyor: ayni etikete bagli iki release kaydi olusuyor,
      # GitHub da /releases/download/<tag>/<dosya> adresini cozemeyip 404 veriyor.
      # O yuzden once uret, sonra hepsini tek seferde biz ekliyoruz.
      - name: DMG uret
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Release olustur
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ls -lh dist/*.dmg
          gh release create "${GITHUB_REF#refs/tags/}" dist/*.dmg \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
