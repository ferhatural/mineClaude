name: release

# Bir surum etiketi push edilince macOS DMG, Windows NSIS kurulumcusu ve Linux
# AppImage/deb/rpm paketlerini uretip ayni Release'e ekler.
#
#   npm version 1.1.0 && git push --follow-tags
#
# macOS'ta imzalama yok: Apple Developer hesabi gerektiriyor. Imzasiz uygulama
# indirilince Gatekeeper karantinaya aliyor, install.sh onu temizliyor.
# Windows'ta da imzalama yok: indiren kisi SmartScreen uyarisini gecmek zorunda.
#
# Uc platform da package.json > build.publish (fork'u hedefliyor) sayesinde
# guncelleme metadata dosyasini (latest.yml / latest-mac.yml / latest-linux.yml)
# Release'e ekliyor — kurulu uygulamalar buradan guncelleme arıyor (bkz.
# electron/main.js > setupAutoUpdate). Linux tarafinda sadece AppImage hedefi
# electron-updater ile kendini guncelleyebiliyor (deb/rpm desteklenmiyor).
#
# Uc is de ayni etikete Release yazdigi icin once "prepare-release" tek basina
# Release kaydini olusturuyor (veya var olani onayliyor); macOS/Windows/Linux
# isleri ona "needs" ile bagli calisip sadece kendi dosyalarini ekliyor. Boylece
# uc is ayni anda "bu etiket icin Release yok, ben olustureyim" yarisina girip
# birbirini ezmiyor.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Release var mi, yoksa olustur
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release zaten var: $tag"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dal listesinde surekli sadece son 3 surum gorunsun diye her etikette
      # release/<surum> dali olusturuyoruz ve en eskisini siliyoruz.
      - name: release/<surum> dalini olustur, sadece son 3'u tut
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          branch="release/$version"
          git push origin "HEAD:refs/heads/$branch" --force

          mapfile -t branches < <(git ls-remote --heads origin 'release/*' \
            | sed -E 's#.*refs/heads/release/##' \
            | sort -t. -k1,1nr -k2,2nr -k3,3nr)

          echo "Mevcut release dallari (yeniden eskiye): ${branches[*]}"

          for old in "${branches[@]:3}"; do
            echo "Siliniyor: release/$old"
            git push origin --delete "release/$old" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Etiket ile package.json surumu ayrisirsa dosya adlari etiketle uyusmuyor
      # ve install.sh indirecegi URL'i bulamiyor. Sessizce gecmesin.
      - name: Etiket ve surum ayni mi
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "etiket v$tag ile package.json surumu $pkg ayni degil" >&2
            exit 1
          fi

      - run: npm ci

      # npm, native paketlerin kurulum betiklerini varsayilan olarak engelliyor.
      # node-pty derlemeye ihtiyac duymuyor (N-API onceden derlenmis ikili getiriyor)
      # ama izinleri ayarlayan post-install adimi da atlaniyor: spawn-helper
      # calistirilabilir olmazsa PTY acilirken "posix_spawnp failed" veriyor.
      - name: node-pty spawn-helper izni
        run: |
          chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper
          ls -l node_modules/node-pty/prebuilds/darwin-*/spawn-helper

      # electron-builder'in kendi yayincisi her dosyayi ayri ayri yukluyor ve her biri
      # release'i yaratmayi deniyor: ayni etikete bagli iki release kaydi olusuyor,
      # GitHub da /releases/download/<tag>/<dosya> adresini cozemeyip 404 veriyor.
      # O yuzden once uret, sonra hepsini tek seferde biz ekliyoruz.
      # Sertifika sirri var mi? Varsa Developer ID ile imzalayip notarize ediyoruz,
      # yoksa ad-hoc imzayla devam. Ad-hoc imza da olsa imzalamak sart: hic
      # imzalamamak bundle'i "damaged" gosteriyor ve indiren kisiye sildiriyor.
      # `gh secret set` bos stdin'e itiraz etmiyor: hatasiz, bos bir sir yaziyor.
      # Yarim girilmis bir sertifika seti, build'in ortasinda "p12 cozulemedi"
      # gibi anlasilmaz bir hataya donusuyor. Burada bastan ve acikca soyluyoruz.
      - name: Imzalama yolu secilsin
        id: mode
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          KEYID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$P12" ]; then
            echo "sertifika yok — ad-hoc imzayla devam"
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          eksik=""
          [ -z "$P12PASS" ] && eksik="$eksik MACOS_CERT_PASSWORD"
          [ -z "$KEY" ]     && eksik="$eksik APPLE_API_KEY_P8"
          [ -z "$KEYID" ]   && eksik="$eksik APPLE_API_KEY_ID"
          [ -z "$ISSUER" ]  && eksik="$eksik APPLE_API_ISSUER"
          if [ -n "$eksik" ]; then
            echo "::error::Sertifika var ama sunlar bos:$eksik" >&2
            echo "Bos bir sir da 'tanimli' gorunuyor; degerini tekrar yazmak gerekiyor." >&2
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT" 

      # electron-builder p12'yi okuyamazsa "0 identities found" deyip imzalamayi
      # sessizce atliyor ve build yesil gorunuyor. Sorunun ne oldugunu (yanlis
      # parola mi, iceride ozel anahtar yok mu) burada, en basta soyluyoruz.
      - name: Sertifika okunabiliyor mu
        if: steps.mode.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          printf '%s' "$CSC_LINK" | base64 --decode > /tmp/cert.p12 2>/dev/null \
            || { echo "::error::MACOS_CERT_P12 gecerli base64 degil"; exit 1; }
          security create-keychain -p tmp tmp.keychain
          security unlock-keychain -p tmp tmp.keychain
          if ! security import /tmp/cert.p12 -k tmp.keychain -P "$CSC_KEY_PASSWORD" \
                 -T /usr/bin/codesign 2>/tmp/imp.err; then
            echo "::error::p12 iceri alinamadi — parola yanlis olabilir. $(tr -d '\n' < /tmp/imp.err)"
            exit 1
          fi
          n=$(security find-identity -v -p codesigning tmp.keychain | grep -c "Developer ID Application" || true)
          echo "p12 icindeki Developer ID Application kimligi: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::p12 aciliyor ama icinde Developer ID Application *kimligi* yok."
            echo "Muhtemelen yalniz sertifika disa aktarilmis, ozel anahtar olmadan."
            echo "Keychain Access'te 'My Certificates' kategorisinden disa aktarmak gerekiyor."
            exit 1
          fi
          rm -f /tmp/cert.p12

      - name: App Store Connect anahtarini yaz
        if: steps.mode.outputs.signed == 'true'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_P8 }}" > ~/private_keys/AuthKey.p8

      - name: DMG uret — Developer ID + notarize
        if: steps.mode.outputs.signed == 'true'
        run: npx electron-builder --mac --publish never -c.mac.notarize=true
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ~/private_keys/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: DMG uret — ad-hoc (sertifika yok)
        if: steps.mode.outputs.signed != 'true'
        run: npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false

      - name: Imza gecerli mi
        run: |
          for app in dist/mac-*/mineClaude.app; do
            echo "== $app"
            codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier=|Signature=|Sealed|TeamIdentifier'
            codesign --verify --deep --strict "$app"
          done

      # Notarize edildiyse Gatekeeper'in kendisi onaylamali. Ad-hoc yolda bu adim
      # atlanir, cunku notarize olmayan bir uygulamayi reddetmesi zaten dogru.
      - name: Gatekeeper onayliyor mu
        if: steps.mode.outputs.signed == 'true'
        run: |
          for app in dist/mac-*/mineClaude.app; do spctl -a -vvv -t exec "$app"; done

      # --publish never olsa da build.publish tanimliysa electron-builder
      # latest-mac.yml'yi dist/ icine yaziyor, sadece yuklemiyor. Once imza/
      # Gatekeeper dogrulamasi bittigi icin burada guvenle var olan Release'e
      # ekliyoruz — mac'i tekrar derleyip notarize etmeye gerek kalmiyor.
      - name: Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ls -lh dist/*.dmg dist/latest-mac.yml dist/*.blockmap
          gh release upload "${GITHUB_REF#refs/tags/}" \
            dist/*.dmg dist/latest-mac.yml dist/*.blockmap \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Etiket ve surum ayni mi
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "etiket v$tag ile package.json surumu $pkg ayni degil" >&2
            exit 1
          fi

      - run: npm ci

      # electron-builder burada hem NSIS kurulumcuyu uretiyor hem de --publish always
      # ile GitHub Release'e (package.json > build.publish, fork'un hedefliyor)
      # dosyayi ve otomatik guncelleme icin gereken latest.yml'yi kendisi yukluyor.
      # Imzalama sertifikasi yok: indiren kisi SmartScreen'de "Daha fazla bilgi ->
      # yine de calistir" demek zorunda kalir, bu beklenen bir durum.
      - name: NSIS uret ve yayinla
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sadece derle (etiketsiz calistirma)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never

  linux:
    needs: [prepare-release]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Etiket ve surum ayni mi
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "etiket v$tag ile package.json surumu $pkg ayni degil" >&2
            exit 1
          fi

      # node-pty icin hazir bir linux prebuild yok (repo sadece win32/darwin
      # tasiyor): npm ci burada node-gyp ile kaynaktan derliyor. Ubuntu runner'i
      # gcc/make/python3 ile geldigi icin ekstra bir sey kurmaya gerek yok.
      # node-pty N-API kullandigi icin (ABI surumden bagimsiz) bu ikili
      # Electron icinde de sorunsuz calisiyor, npmRebuild:false yeterli.
      - run: npm ci

      # deb icin dpkg araclari Ubuntu runner'da hazir geliyor; rpm icin rpmbuild
      # varsayilan olarak kurulu degil, elle ekliyoruz.
      - name: rpmbuild kur
        run: sudo apt-get update && sudo apt-get install -y rpm

      # AppImage kendi kendini electron-updater ile guncelleyebiliyor; deb/rpm/
      # pacman icin boyle bir mekanizma yok (kullanici paket yoneticisiyle
      # guncelliyor), ama yine de daha genis dagitim destegi icin uretip
      # Release'e ekliyoruz.
      - name: AppImage/deb/rpm/pacman uret ve yayinla
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --linux AppImage deb rpm pacman --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sadece derle (etiketsiz calistirma)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --linux AppImage deb rpm pacman --publish never
