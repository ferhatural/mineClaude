name: backfill-assets

# Tek seferlik yardimci: eski bir tag'in mac/linux asset'lerini, o tag'deki
# gecersiz desktopName alanini SADECE bu calisma icin (tag/commit degismez)
# duzelterek uretir ve mevcut Release'e ekler.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Hangi tag icin uretilecek (orn. v1.3.1)'
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Gecersiz desktopName alanini bu build icin duzelt
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json'));
            if (p.build && p.build.linux && p.build.linux.desktopName) {
              delete p.build.linux.desktopName;
              p.build.linux.syncDesktopName = true;
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('desktopName -> syncDesktopName duzeltildi');
            } else {
              console.log('duzeltme gerekmiyor');
            }
          "

      - run: npm ci

      - name: node-pty spawn-helper izni
        run: |
          chmod +x node_modules/node-pty/prebuilds/darwin-*/spawn-helper

      - name: DMG uret — ad-hoc
        run: npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false

      - name: Release'e ekle
        run: |
          ls -lh dist/*.dmg dist/latest-mac.yml dist/*.blockmap
          gh release upload "${{ inputs.tag }}" dist/*.dmg dist/latest-mac.yml dist/*.blockmap --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Gecersiz desktopName alanini bu build icin duzelt
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json'));
            if (p.build && p.build.linux && p.build.linux.desktopName) {
              delete p.build.linux.desktopName;
              p.build.linux.syncDesktopName = true;
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('desktopName -> syncDesktopName duzeltildi');
            } else {
              console.log('duzeltme gerekmiyor');
            }
          "

      - run: npm ci

      - name: AppImage uret ve yayinla
        run: npx electron-builder --linux AppImage --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
